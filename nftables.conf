#!/usr/sbin/nft -f
flush ruleset

define WAN_IF = eth0
define LAN_IF = eth1
define LAN_NET = 192.168.10.0/24

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept
        ct state established,related accept
        ct state invalid drop

        # Dostep administracyjny SSH i diagnostyka ICMP z sieci VPN (eth0) oraz LAN (eth1)
        iifname { $WAN_IF, $LAN_IF } tcp dport 22 accept
        iifname { $WAN_IF, $LAN_IF } ip protocol icmp accept

        # Lokalny serwer DHCP i DNS dla sieci LAN
        iifname $LAN_IF udp dport { 53, 67 } accept
        iifname $LAN_IF tcp dport 53 accept

        log prefix "NFT-INPUT-DROP: " flags all counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop

        # Kolejka NFQUEUE 0 dla Suricata IPS (tryb fail-open bypass)
        iifname $LAN_IF oifname $WAN_IF queue num 0 bypass

        # Ruch wychodzacy z LAN do WAN
        iifname $LAN_IF oifname $WAN_IF accept

        log prefix "NFT-FORWARD-DROP: " flags all counter drop
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN_IF ip saddr $LAN_NET masquerade
    }
}
