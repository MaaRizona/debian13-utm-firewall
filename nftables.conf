#!/usr/sbin/nft -f
flush ruleset

define WAN_IF = enp0s3
define LAN_IF = enp0s8
define DMZ_IF = enp0s9
define WG_IF  = wg0

define LAN_NET = 192.168.10.0/24
define DMZ_NET = 10.0.100.0/24
define WG_NET  = 10.8.0.0/24

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept
        ct state established,related accept
        ct state invalid drop

        # WireGuard na WAN
        iifname $WAN_IF udp dport 51820 accept

        # Tymczasowy dostęp SSH z WAN (do wyłączenia po skonfigurowaniu VPN)
        iifname { $WG_IF, $LAN_IF, $DMZ_IF } ip protocol icmp accept
        iifname { $WG_IF, $LAN_IF, $DMZ_IF } ip protocol icmp accept

        # DNS i DHCP dla LAN i VPN
        iifname { $LAN_IF, $DMZ_IF, $WG_IF } udp dport { 53, 67 } accept
        iifname { $LAN_IF, $DMZ_IF, $WG_IF } tcp dport 53 accept

        # Docelowy dostęp SSH z VPN i LAN
        iifname { $WG_IF, $LAN_IF } tcp dport 22 accept
        iifname { $WG_IF, $LAN_IF, $DMZ_IF } ip protocol icmp accept
        iifname { $WG_IF, $LAN_IF, $DMZ_IF } ip protocol icmp accept

        log prefix "NFT-INPUT-DROP: " flags all counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop

        # Hook pod Suricatę IPS kolegów (kolejka 0 z fail-open bypass)
        iifname $LAN_IF oifname $WAN_IF queue num 0 bypass
        iifname $DMZ_IF oifname $WAN_IF queue num 0 bypass
        iifname $WG_IF  oifname $WAN_IF queue num 0 bypass

        # Polityka strefowa
        iifname $LAN_IF oifname { $WAN_IF, $DMZ_IF } accept
        iifname $WG_IF  oifname { $LAN_IF, $DMZ_IF, $WAN_IF } accept
        iifname $DMZ_IF oifname $WAN_IF accept

        # Izolacja DMZ -> LAN
        iifname $DMZ_IF oifname $LAN_IF log prefix "NFT-DMZ-TO-LAN-DROP: " drop

        log prefix "NFT-FORWARD-DROP: " flags all counter drop
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN_IF ip saddr { $LAN_NET, $DMZ_NET, $WG_NET } masquerade
    }
}
