interface=enp0s8
interface=enp0s9
bind-interfaces

domain-needed
bogus-priv
no-resolv
server=1.1.1.1
server=9.9.9.9

# DHCP dla LAN (enp0s8)
dhcp-range=interface:enp0s8,192.168.10.50,192.168.10.150,255.255.255.0,12h
dhcp-option=interface:enp0s8,option:router,192.168.10.1
dhcp-option=interface:enp0s8,option:dns-server,192.168.10.1

# DHCP dla DMZ (enp0s9)
dhcp-range=interface:enp0s9,10.0.100.50,10.0.100.150,255.255.255.0,12h
dhcp-option=interface:enp0s9,option:router,10.0.100.1
dhcp-option=interface:enp0s9,option:dns-server,10.0.100.1
